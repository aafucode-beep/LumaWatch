services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      # SQLite 数据与抓取缓存持久化到宿主机
      - ./data:/app/data
    expose:
      - "8000"
    # 如需本机直连后端调试，可临时放开端口映射：
    # ports:
    #   - "8000:8000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    environment:
      # 在 .env 或 shell 中设置：DOMAIN=your.domain.com
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
